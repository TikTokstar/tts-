[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q
filterwarnings =
    # Идват от TikTokLive/websockets, не от нашия код.
    ignore::DeprecationWarning:websockets.*
    ignore::DeprecationWarning:TikTokLive.*
    ignore:.*audioop.*:DeprecationWarning
    ignore:.*ffmpeg.*:RuntimeWarning
    ignore:.*ffprobe.*:RuntimeWarning
